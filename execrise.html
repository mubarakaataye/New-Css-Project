<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .container{
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .box{
            display: flex;
           flex-wrap: wrap;
           justify-content: center;
        }
        img{
            height: 500px;
            width: 500px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">
            <img src="download (1).jfif" alt="">
            <img src="download (2).jfif" alt="">
            <img src="download.jfif" alt="">
        </div>
    </div>
</body>
</html>

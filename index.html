<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        *{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
.container{
    height: 100vh;
    width: 100%;
  display: flex;
    justify-content: center;
     align-items: center;
     
}
.box{
    height: 400px;
    width: 400px;
    background-color: blue;
    border-radius: 12px;  
}
.container.box::after{
    content: "";
    height: 400px;
    width: 400px;
    background-color: crimson;
    z-index: 10;
}
.c{
    margin: 12px;
    padding: 6px;
    height: auto;
    width: 600px;
    background-color: blueviolet;
    border-radius: 12px;
    z-index: 12;
    display: flex;
    align-items: center;
    justify-content: center;
    position: absolute;
    top: 0;
    left: 0;
    gap: 22px;
}
.d{
    z-index: 12;
    display: flex;
    z-index: 12;
    border-radius: 12px;
    background-color: blueviolet;
    width: 600px;
    margin: 12px; 
    padding: 6px;
    height: auto;
}
    </style>
</head>
<body>
    <div class="container">
        <div class="box"></div>
    </div>
</body>
</html>

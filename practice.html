<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        nav{
            width: 100%;
            padding: 8px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            background-color: wheat;
        }
        nav div.pages ul{
            display: flex;
            gap: 12px;

      }
      nav div.pages ul li{
    list-style-type: none;
}
nav div.pages ul li a{
    text-decoration: none;
    color: var(--bg-color);
    text-transform: uppercase;
}
nav div.services div span a{
    color: var(--bg-color);
    text-decoration: none;
}
nav div.pages ul li a:hover{
    color: var(--brand-color);
}
nav div.services{
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    color: var(--bg-color);
}
nav div img{
    height: 80px;
}
nav button{
    padding: 10px 12px;
    border: 1px solid var(--bg-color);
    color: white;
    border-radius: 12px;
    white-space: nowrap;
    background-color: var(--btn-color);
}
nav div.pages ul li.menu{
    position: relative;
}
nav div.pages ul li.menu div.sub-menu{
    background-color: var(--bg-color);
    height:fit-content;
    padding: 12px;
    position: absolute;
    top: 28px;
    left: 0;
    width: 900px;
    display: none;
    margin: 7px auto;
    border: 0.5px solid var(--text-primary-color);
}
nav div.pages ul li.menu:hover div.sub-menu{
    display: block;
    justify-content: space-between;
    gap: 9px;
    flex-wrap: wrap;
}
nav div.pages ul li.menu div.sub-menu div.box{
    display: flex;
    align-items: center;
}
nav div.pages ul li.menu div.sub-menu div.box img{
    height: 100px;
    width: 100px;
}
nav div.pages ul li.menu div.sub-menu div.box div{
    display: flex;
    flex-direction: column;
    gap: 5px;
    align-items: center;
}
nav div.pages ul li.blog{
    position: relative;
}
nav div.pages ul li.blog ul.sub-blog{
    position: absolute;
    top: 28px;
    left: 0;
    height: fit-content;
    width: fit-content;
    background-color: white;
    padding: 6px 16px;
    display: none;
}
nav div.pages ul li.blog:hover ul.sub-blog{
    display: block;
    list-style-position: inside;
    list-style-type: none;
}
nav div.pages ul li.blog:hover ul.sub-blog li a{
    text-decoration: none;
     color: black;
    position: relative;
    white-space: nowrap;
    line-height: 20px;
}
nav div.pages ul li.blog:hover ul.sub-blog li a::before{
    content: "";
    background-color: var(--brand-color);
    position: absolute;
    top: -12px;
    left: 5px;
    height: 6px;
    width: 6px;
}
    </style>
</head>
<body>
    <nav>
        <!--logo-->

        </div>
        <!--pages-->
        <div>
            <ul>
                <li><a href="#">Home</a></li>

                <div class="sub-menu">
                    <div class="box">
                        <img src="" alt="">
                        <div>
                            <span>Pepperoni</span>

                        </div>
                    </div>
                    <div class="box">
                        <img src="" alt="">
                        <div>
                            <span>Pepperoni</span>
                            <span>$12.99</span>
                        </div>
                        <div class="box">
                            <img src="" alt="">
                            <div>
                                 <span>Pepperoni</span>
                                 <span>$12.99</span>
                            </div>
                        </div>
                        <div class="box">
                            <img src="" alt="">
                             <span>Pepperoni</span>
                             <span>$12.99</span>
                        </div>
                        <div class="box">
                            <img src="" alt="">
                             <span>Pepperoni</span>
                              <span>$12.99</span>
                        </div>
                        <div></div>
                    </div>
                </div>
            </li>
                <li><a href="#">Blog</a></li>
            </ul>
        </div>
        <!--service-->
        <div>
            <ul>
              <li><a href="">781904520</a></li>

            </ul>
        </div>
    </nav>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        div{
            width: 100%;
            display: flex;
            
            
        }
        div> img{
            height: 500px;
            width: 500px;
            border: 1px solid black;
            border-radius: 12px;
            gap: 12px;
           flex-wrap: wrap;
           justify-content: center;
           
        }
        nav{
            width: 100%;
            padding: 12px 8px;
            display: flex;
            justify-content: space-between;
            backdrop-filter: blur(12px);
            background-color: transparent;
            position: fixed;
            top: 0;
            left: 0;
        }
        nav ul{
          display: flex;
          justify-content: center;
          gap: 8px;
        }
    </style>
</head>
<body>
    <nav>
        <h1>Fashion Show</h1>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Contact</a></a></li>
        </ul>
    </nav>
    <div>
        <img src="download (1).jfif" alt="">
        <img src="download (2).jfif" alt="">
        <img src="download.jfif" alt="">
    </div>
</body>
</html>

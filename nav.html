<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        nav{
            width: 100%;
            display: flex;
            justify-content: space-between;
        }
        nav h1{
            font-weight: bold;
            
        }
        nav ul{
            display: flex;
            list-style: none;
        }
        nav ul li{
          padding: 12px;
            
        }
        nav ul li a{
            text-decoration: none;
            color: black;
            font-size: 20px;
        }
        @media(max-width: 768px){
             nav h1{
            font-size: 28px;
            
        }
    }
    </style>
</head>
<body>
    <nav>
        <h1>Fashion Show</h1>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Product</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>
</body>
</html>

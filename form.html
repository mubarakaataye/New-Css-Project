<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
       div.parent{
        width: 100%;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-image: url("download.jfif");
        background-size: cover;
        background-repeat: no-repeat;
       }
       div.parent div.container{
        border: 1px solid black;
        padding: 12px 20px;
        max-width: 600px;
        min-width: 60%;
        border-radius: 8px;
        display: flex;
        align-items: center;
        flex-direction: column;
        background-image: linear-gradient(60deg, rgba(255, 255, 255, 0.4), rgba(255,255,255, 0.8));
       }
       div.parent div.container form{
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 8px;
        align-items: center;
       } 
       div.parent div.container form div{
        display: flex;
        flex-direction: column;
        gap: 3px;
        width: 100%;
       }
       div.parent div.container form div input,select{
        padding: 8px;
        border-radius: 5px;
        width: 100%;
        background-color: transparent;
       }
       div.parent div.container form div input:focus{
        outline: none;
       }
       div.parent div.container form button{
        padding: 10px 20px;
        width: fit-content;
        border: none;
        background: blue;
        color: white;
        border-radius: 5px;
       }
       div.parent div.container h1{
        font-size: 42px;
        font-weight: 900;
        background-image: linear-gradient(45deg, blue, purple);
        color: transparent;
        background-clip: text;
       }
       @media(max-width:768px){
        div.parent div.container {
    border:none;
    max-width: 700px;
    width: 90%;
    border-radius: 12px;
   
   
}
       }
       @media(max-width:480px){
        div.parent div.container {
    border: 1px solid black;
    padding: 12px 8px;
    min-width: 90%;
    width: 90%;
    border-radius: 5px;
   
  
    
}
       }
    .inp{
        display: flex;
    }
    </style>
</head>
<body>
    <div class="parent">
        <div class="container">
            <form>
                <h1>Login Form</h1>
                <div>
                <label for="">Name</label>
                <input type="text" placeholder="Enter your name!">
                </div>
                <div>
                    <label for="">Last Name</label>
                    <input type="text" placeholder="Enter your last name!">
                </div>
                <div>
                    <label for="">Phone Number</label>
                    <input type="number" placeholder="Enter your phone number!">
                </div>
                <div>
                    <label for="">Password</label>
                    <input type="password" placeholder="Enter your password!">
                </div>
                <div>
                    <label for="">Gender</label>
                   <div class="inp">
                    <input type="radio" name="Gender" value="Male"/>Male
                    <input type="radio" name="Gender" value="Female"/>Female
                    <input type="radio" name="Gender" value="Rather Not Say"/>Rather Not Say
                   </div>
                </div>
                <div>
                    <div>
                        <label for="">Favorite Color</label>
                        <div class="inp">
                        <input type="checkbox">/Black
                        <input type="checkbox"/>Blue
                        <input type="checkbox"/>Red
                        </div>
                    </div>
                    <label for="">Country</label>
                    <select>
                        <option value="afghanasitan">Afghanistan</option>
                        <option value="Iran">Iran</option>
                        <option disabled value="pakistan">Pakistan</option>
                        <option value="United State">United State</option>
                        <option selected value="United Kingdom">United Kinkdom</option>
                    </select>
                </div>
                <button>Login</button>
            </form>
        </div>
    </div>
</body>
</html>
